<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APT Repository</title>
<style>
/* ---------- reset & base ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: dark;
  --bg:        #0d1117;
  --bg2:       #161b22;
  --bg3:       #21262d;
  --border:    #30363d;
  --text:      #c9d1d9;
  --text-dim:  #6e7681;
  --accent:    #3fb950;
  --accent-dim:#1a4a24;
  --danger:    #f85149;
  --shadow:    rgba(0,0,0,0.4);
  --font:      'JetBrains Mono', 'Fira Code', monospace;
  --radius:    4px;
}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg:        #ffffff;
    --bg2:       #f6f8fa;
    --bg3:       #eaeef2;
    --border:    #d0d7de;
    --text:      #1f2328;
    --text-dim:  #5e666e;
    --accent:    #187733;
    --accent-dim:#dafbe1;
    --danger:    #cf222e;
    --shadow:    rgba(31,35,40,0.16);
  }
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ---------- layout ---------- */
header {
  border-bottom: 1px solid var(--border);
  padding: 18px 28px;
  display: flex;
  align-items: baseline;
  gap: 16px;
}
header h1 {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.04em;
}
header .subtitle {
  color: var(--text-dim);
  font-size: 12px;
}

.toolbar {
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  background: var(--bg2);
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 160px;
}
.search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
}
#search {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  padding: 6px 10px 6px 32px;
  outline: none;
  transition: border-color 0.15s;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--text-dim); }

/* ---------- multi-select dropdown ---------- */
.ms-wrap {
  position: relative;
  user-select: none;
}
.ms-trigger {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  padding: 6px 28px 6px 10px;
  cursor: pointer;
  white-space: nowrap;
  min-width: 120px;
  position: relative;
  transition: border-color 0.15s;
}
.ms-trigger::after {
  content: '▾';
  position: absolute;
  right: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 11px;
}
.ms-trigger:hover, .ms-wrap.open .ms-trigger { border-color: var(--accent); }
.ms-panel {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  min-width: 160px;
  max-height: 260px;
  overflow-y: auto;
  z-index: 100;
  box-shadow: 0 8px 24px var(--shadow);
}
.ms-wrap.open .ms-panel { display: block; }
.ms-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  cursor: pointer;
  transition: background 0.1s;
}
.ms-option:hover { background: var(--bg3); }
.ms-option.ms-all { border-bottom: 1px solid var(--border); }
.ms-option input[type=checkbox] {
  accent-color: var(--accent);
  width: 13px; height: 13px;
  cursor: pointer;
}
.ms-option label { cursor: pointer; flex: 1; }

/* ---------- reload button ---------- */
.reload-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 30px; height: 30px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-dim);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.reload-btn:hover:not(:disabled), .reload-btn:focus-visible {
  color: var(--accent);
  border-color: var(--accent);
}
.reload-btn:disabled { cursor: default; opacity: 0.6; }
.reload-btn.spin svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .reload-btn.spin svg { animation: none; }
}

/* ---------- status bar ---------- */
#status {
  padding: 8px 28px;
  font-size: 11px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  min-height: 30px;
  display: flex;
  align-items: center;
  gap: 16px;
}
#status .pill {
  background: var(--accent-dim);
  color: var(--accent);
  border-radius: 20px;
  padding: 1px 8px;
  font-size: 11px;
}
#status .err { color: var(--danger); }

/* ---------- table ---------- */
.table-wrap {
  overflow-x: auto;
  padding: 0 28px 28px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 14px;
}
th {
  text-align: left;
  padding: 8px 12px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  cursor: pointer;
}
th:hover { color: var(--text); }
th .sort-arrow { margin-left: 4px; opacity: 0.4; }
th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
td {
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg2); }

.pkg-name { color: var(--accent); font-weight: 500; }
.pkg-ver  { color: var(--text-dim); }
.pkg-arch {
  display: inline-block;
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 6px;
  font-size: 11px;
  color: var(--text-dim);
}
.pkg-size { color: var(--text-dim); white-space: nowrap; }
.pkg-desc { color: var(--text); max-width: 380px; }
.pkg-comp {
  font-size: 11px;
  color: var(--text-dim);
  opacity: 0.7;
}

/* ---------- download column ---------- */
.col-dl { width: 1%; text-align: center; white-space: nowrap; }
/* Not a sortable column, so it must not look clickable like the others. */
th.col-dl { cursor: default; }
th.col-dl:hover { color: var(--text-dim); }
.dl-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px; height: 26px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-dim);
  background: var(--bg3);
  transition: color 0.15s, border-color 0.15s;
}
.dl-btn:hover, .dl-btn:focus-visible {
  color: var(--accent);
  border-color: var(--accent);
}
.dl-na { color: var(--text-dim); opacity: 0.6; }

/* Visually hidden, but still read out by screen readers. */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty-state .icon { font-size: 32px; margin-bottom: 12px; }

/* ---------- highlight match ---------- */
mark {
  background: var(--accent-dim);
  color: var(--accent);
  border-radius: 2px;
  padding: 0 1px;
}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
<link rel="stylesheet" href="custom.css" onerror="this.remove()">
</head>
<body>

<header>
  <h1>⬡ APT Repository</h1>
  <span class="subtitle" id="header-sub">Loading…</span>
</header>

<div class="toolbar">
  <div class="ms-wrap" id="ms-dist">
    <div class="ms-trigger" id="ms-dist-trigger">Dists</div>
    <div class="ms-panel" id="ms-dist-panel"></div>
  </div>
  <div class="ms-wrap" id="ms-comp">
    <div class="ms-trigger" id="ms-comp-trigger">Components</div>
    <div class="ms-panel" id="ms-comp-panel"></div>
  </div>
  <div class="ms-wrap" id="ms-arch">
    <div class="ms-trigger" id="ms-arch-trigger">Architectures</div>
    <div class="ms-panel" id="ms-arch-panel"></div>
  </div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="search" type="search" placeholder="Filter packages…" autocomplete="off" spellcheck="false">
  </div>
  <button class="reload-btn" id="reload" type="button"
          title="Reload from the repository" aria-label="Reload from the repository">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
    </svg>
  </button>
</div>

<div id="status">
  <span id="status-text">Select a distribution to begin.</span>
</div>

<div class="table-wrap">
  <table id="pkg-table">
    <thead>
      <tr>
        <th data-col="Package" class="sorted">Package <span class="sort-arrow">↑</span></th>
        <th data-col="Version">Version <span class="sort-arrow">↕</span></th>
        <th data-col="Architecture">Arch <span class="sort-arrow">↕</span></th>
        <th data-col="Size">Size <span class="sort-arrow">↕</span></th>
        <th data-col="Description">Description <span class="sort-arrow">↕</span></th>
        <th data-col="_component">Component <span class="sort-arrow">↕</span></th>
        <th data-col="_dist">Dist <span class="sort-arrow">↕</span></th>
        <th class="col-dl"><span class="sr-only">Download</span></th>
      </tr>
    </thead>
    <tbody id="pkg-body"></tbody>
  </table>
  <div class="empty-state" id="empty-state" style="display:none">
    <div class="icon">◫</div>
    <div id="empty-msg">No packages match your filter.</div>
  </div>
</div>

<script>
// ─── Repo base URL (directory containing this page) ──────────────────────────
// Derived from the document location so the page works at any URL prefix,
// e.g. https://repo.example.com/apt/ or http://apt.example.com/.
function repoBase() {
  return new URL('.', document.baseURI).href.replace(/[/]$/, '');
}

// ─── Filter state in the URL ─────────────────────────────────────────────────
// The current selection is mirrored into the query string so that reloading
// the page (or sharing the link) comes back to the same view instead of
// resetting to everything.
function readFilterParams() {
  const p = new URLSearchParams(location.search);
  const list = name => (p.get(name) || '').split(',')
                        .map(s => s.trim()).filter(Boolean);
  return {
    dists: list('dist'),
    comps: list('comp'),
    archs: list('arch'),
    q:     p.get('q') || '',
  };
}

function writeFilterParams() {
  const p = new URLSearchParams();
  // "All" is the default, so it is left out to keep the usual URL clean.
  if (distCtrl && !distCtrl.isAll()) p.set('dist', distCtrl.getSelected().join(','));
  if (compCtrl && !compCtrl.isAll()) p.set('comp', compCtrl.getSelected().join(','));
  if (archCtrl && !archCtrl.isAll()) p.set('arch', archCtrl.getSelected().join(','));
  const q = document.getElementById('search').value.trim();
  if (q) p.set('q', q);

  const qs = p.toString();
  try {
    // replaceState, not pushState: every checkbox click would otherwise add a
    // history entry and make the back button useless.
    history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
  } catch (e) {
    // Not worth breaking the page over (e.g. an unusual origin); the filters
    // still work, they just will not survive a reload.
  }
}

// ─── Packages file parser ─────────────────────────────────────────────────────
function parsePackages(text) {
  text = text.replace(/\r\n/g, '\n');   // tolerate CRLF line endings
  return text.split(/\n\n+/).flatMap(stanza => {
    stanza = stanza.trim();
    if (!stanza) return [];
    const pkg = {};
    let lastKey = null;
    for (const line of stanza.split('\n')) {
      if (line.startsWith(' ') || line.startsWith('\t')) {
        if (lastKey) pkg[lastKey] = (pkg[lastKey] || '') + '\n' + line.trim();
      } else {
        const colon = line.indexOf(': ');
        if (colon === -1) continue;
        lastKey = line.slice(0, colon);
        pkg[lastKey] = line.slice(colon + 2);
      }
    }
    return pkg.Package ? [pkg] : [];
  });
}

// ─── Size formatter ───────────────────────────────────────────────────────────
function fmtSize(bytes) {
  if (!bytes) return '—';
  const n = parseInt(bytes, 10);
  if (isNaN(n)) return '—';
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MiB';
  if (n >= 1024)    return (n / 1024).toFixed(0)    + ' KiB';
  return n + ' B';
}

// ─── Highlight search term in text ───────────────────────────────────────────
function highlight(text, term) {
  if (!term) return escHtml(text);
  const idx = text.toLowerCase().indexOf(term.toLowerCase());
  if (idx === -1) return escHtml(text);
  return escHtml(text.slice(0, idx))
    + '<mark>' + escHtml(text.slice(idx, idx + term.length)) + '</mark>'
    + escHtml(text.slice(idx + term.length));
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// escHtml is enough for text between tags, but attribute values must also
// escape quotes, otherwise a value containing one could end the attribute and
// inject further markup.
function escAttr(s) {
  return escHtml(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─── Download URL for a package ──────────────────────────────────────────────
// The Packages index gives a Filename relative to the repository root, e.g.
// pool/bookworm/main/h/hello/hello_1.0_amd64.deb.  Returns null when the field
// is missing or is not a plain relative path, so such a row simply gets no
// download link instead of a broken or surprising one.
function debUrl(filename) {
  if (!filename) return null;
  const segments = filename.split('/');
  if (segments.some(s => s === '' || s === '.' || s === '..')) return null;
  // Encode each segment separately: the separators must survive, while
  // characters that are legal in a filename but awkward in a URL (such as the
  // ':' of an epoch version) must not.
  return `${repoBase()}/${segments.map(encodeURIComponent).join('/')}`;
}

// ─── Debian version comparison (matches dpkg --compare-versions) ─────────────
function debVerCompare(a, b) {
  a = String(a); b = String(b);
  const splitEpoch = v => {
    const i = v.indexOf(':');
    if (i === -1) return [0, v];
    return [parseInt(v.slice(0, i), 10) || 0, v.slice(i + 1)];
  };
  const splitRev = v => {
    const i = v.lastIndexOf('-');
    return i === -1 ? [v, ''] : [v.slice(0, i), v.slice(i + 1)];
  };
  const order = c => {
    if (c === '~') return -1;
    if (c === undefined || c === '') return 0;
    if (c >= '0' && c <= '9') return 0;
    if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) return c.charCodeAt(0);
    return c.charCodeAt(0) + 256;
  };
  const isDigit = c => c >= '0' && c <= '9';
  const cmpPart = (x, y) => {
    let i = 0, j = 0;
    while (i < x.length || j < y.length) {
      let fi = i, fj = j;
      while (fi < x.length && !isDigit(x[fi])) fi++;
      while (fj < y.length && !isDigit(y[fj])) fj++;
      const nx = x.slice(i, fi), ny = y.slice(j, fj);
      let k = 0;
      while (k < nx.length || k < ny.length) {
        const ox = order(nx[k]), oy = order(ny[k]);
        if (ox !== oy) return ox < oy ? -1 : 1;
        k++;
      }
      i = fi; j = fj;
      let di = i, dj = j;
      while (di < x.length && isDigit(x[di])) di++;
      while (dj < y.length && isDigit(y[dj])) dj++;
      const dx = parseInt(x.slice(i, di) || '0', 10);
      const dy = parseInt(y.slice(j, dj) || '0', 10);
      if (dx !== dy) return dx < dy ? -1 : 1;
      i = di; j = dj;
    }
    return 0;
  };
  const [ea, ra] = splitEpoch(a), [eb, rb] = splitEpoch(b);
  if (ea !== eb) return ea < eb ? -1 : 1;
  const [ua, rua] = splitRev(ra), [ub, rub] = splitRev(rb);
  return cmpPart(ua, ub) || cmpPart(rua, rub);
}

// ─── Multi-select dropdown ────────────────────────────────────────────────────
function buildMultiSelect(wrapId, triggerId, panelId, items, placeholder, onChange,
                         initialSelected) {
  const wrap    = document.getElementById(wrapId);
  const trigger = document.getElementById(triggerId);
  const panel   = document.getElementById(panelId);

  let allSelected = true;   // "All" active: every item counts as selected
  const state = {};         // individual picks, only meaningful while !allSelected
  items.forEach(item => { state[item] = false; });

  // A selection restored from the URL may name things this repository no
  // longer has; those are ignored, and if nothing valid is left the selector
  // simply starts on "All" rather than showing an empty view.
  const restored = (initialSelected || []).filter(name => items.includes(name));
  if (restored.length) {
    allSelected = false;
    restored.forEach(name => { state[name] = true; });
  }

  function selectedItems() {
    return allSelected ? items.slice() : items.filter(item => state[item]);
  }

  function updateTrigger() {
    const selected = selectedItems();
    trigger.textContent = allSelected
      ? placeholder
      : selected.length === 0
        ? `${placeholder}: none`
        : selected.join(', ');
  }

  function chooseAll() {
    // "All" cannot be switched off directly -- that would leave nothing
    // selected -- so clicking it while already active just redraws.
    if (allSelected) { render(); return; }
    allSelected = true;
    items.forEach(item => { state[item] = false; });
    render();
    onChange();
  }

  function toggleItem(item, checked) {
    if (allSelected) {
      // The first individual pick replaces "All" with only that item.
      allSelected = false;
      items.forEach(i => { state[i] = false; });
      state[item] = true;
    } else {
      state[item] = checked;
      // Unchecking the last remaining pick falls back to "All" rather than
      // leaving an empty selection with nothing to show.
      if (!items.some(i => state[i])) allSelected = true;
    }
    render();
    onChange();
  }

  // 'id' is namespaced by the caller so the "All" entry can never collide with
  // an item that happens to be named "All".
  function addOption(id, label, checked, onToggle, extraClass) {
    const opt = document.createElement('div');
    opt.className = extraClass ? `ms-option ${extraClass}` : 'ms-option';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = `${panelId}-${id}`;
    cb.checked = checked;
    const lbl = document.createElement('label');
    lbl.htmlFor = cb.id;
    lbl.textContent = label;
    cb.addEventListener('change', () => onToggle(cb.checked));
    opt.append(cb, lbl);
    panel.appendChild(opt);
  }

  function render() {
    panel.innerHTML = '';
    addOption('all', 'All', allSelected, chooseAll, 'ms-all');
    items.forEach(item => {
      addOption(`item-${item}`, item, !allSelected && !!state[item],
                checked => toggleItem(item, checked));
    });
    updateTrigger();
  }

  trigger.addEventListener('click', e => {
    e.stopPropagation();
    wrap.classList.toggle('open');
  });

  render();

  return {
    getSelected: selectedItems,
    isAll: () => allSelected,
    setItems(newItems) {
      items = newItems;
      Object.keys(state).forEach(k => { if (!newItems.includes(k)) delete state[k]; });
      newItems.forEach(item => { if (!(item in state)) state[item] = false; });
      if (!allSelected && !newItems.some(item => state[item])) allSelected = true;
      render();
    }
  };
}

// close dropdowns on outside click
document.addEventListener('click', () => {
  document.querySelectorAll('.ms-wrap.open').forEach(el => el.classList.remove('open'));
});

// ─── Sorting state ────────────────────────────────────────────────────────────
let sortCol = 'Package', sortAsc = true;

document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) { sortAsc = !sortAsc; }
    else { sortCol = col; sortAsc = true; }
    document.querySelectorAll('th[data-col]').forEach(t => {
      t.classList.remove('sorted');
      t.querySelector('.sort-arrow').textContent = '↕';
    });
    th.classList.add('sorted');
    th.querySelector('.sort-arrow').textContent = sortAsc ? '↑' : '↓';
    renderTable();
  });
});

// ─── App state ────────────────────────────────────────────────────────────────
let allPackages = [];   // all loaded pkg objects
let repoMeta   = {};   // from repo.json
let distCtrl, compCtrl, archCtrl;
let loadToken = 0;     // increments per load; stale responses are discarded

function setStatus(msg, count) {
  document.getElementById('status-text').textContent = msg;
  const pill = document.getElementById('status-pill');
  if (count !== undefined) {
    if (!pill) {
      const p = document.createElement('span');
      p.className = 'pill'; p.id = 'status-pill';
      document.getElementById('status').appendChild(p);
    }
    document.getElementById('status-pill').textContent = `${count} packages`;
  } else if (pill) {
    pill.remove();
  }
}

// ─── Fetch + parse Packages files ────────────────────────────────────────────
async function loadPackages(selectedDists, selectedComps, selectedArchs,
                            fresh = false) {
  const myToken = ++loadToken;
  setStatus('Loading…');

  const base = repoBase();

  const fetches = [];
  for (const dist of selectedDists) {
    const distInfo = repoMeta.dists[dist];
    if (!distInfo) continue;
    for (const comp of selectedComps) {
      if (!distInfo.components.includes(comp)) continue;
      for (const arch of distInfo.architectures) {
        if (!selectedArchs.includes(arch)) continue;
        const url = `${base}/dists/${dist}/${comp}/binary-${arch}/Packages`;
        fetches.push(
          fetch(url, fresh ? { cache: 'reload' } : undefined)
            .then(r => r.ok ? r.text() : Promise.reject(r.status))
            .then(text => {
              const pkgs = parsePackages(text);
              pkgs.forEach(p => { p._dist = dist; p._component = comp; });
              return pkgs;
            })
            .catch(() => [])   // missing Packages file is not an error
        );
      }
    }
  }

  const results = await Promise.all(fetches);

  // A newer load was started while we awaited: discard these stale results.
  if (myToken !== loadToken) return;

  // Deduplicate: keep all distinct (package, version, arch, dist, component)
  // combos.  Architecture:all packages appear in every binary-<arch> index,
  // so this also collapses those duplicates into a single row.
  const seen = new Set();
  const merged = [];
  results.flat().forEach(pkg => {
    const key = `${pkg.Package}|${pkg.Version}|${pkg.Architecture}|${pkg._dist}|${pkg._component}`;
    if (!seen.has(key)) { seen.add(key); merged.push(pkg); }
  });
  allPackages = merged;

  renderTable();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderTable() {
  const term = document.getElementById('search').value.trim().toLowerCase();
  const body = document.getElementById('pkg-body');
  const empty = document.getElementById('empty-state');
  const emptyMsg = document.getElementById('empty-msg');

  let filtered = allPackages;
  if (term) {
    filtered = filtered.filter(p =>
      (p.Package       || '').toLowerCase().includes(term) ||
      (p.Description   || '').toLowerCase().split('\n')[0].includes(term)
    );
  }

  // Sort.  Don't mutate allPackages when there's no active filter.
  filtered = filtered.slice().sort((a, b) => {
    if (sortCol === 'Size') {
      const va = parseInt(a.Size, 10) || 0;
      const vb = parseInt(b.Size, 10) || 0;
      return sortAsc ? va - vb : vb - va;
    }
    if (sortCol === 'Version') {
      const r = debVerCompare(a.Version || '', b.Version || '');
      return sortAsc ? r : -r;
    }
    const va = a[sortCol] || '', vb = b[sortCol] || '';
    return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
  });

  if (filtered.length === 0) {
    body.innerHTML = '';
    empty.style.display = '';
    emptyMsg.textContent = allPackages.length === 0
      ? 'Select a distribution to load packages.'
      : 'No packages match your filter.';
    setStatus(allPackages.length === 0 ? 'No packages loaded.' : `0 of ${allPackages.length} packages`);
    return;
  }

  empty.style.display = 'none';
  const termRaw = document.getElementById('search').value.trim();

  body.innerHTML = filtered.map(p => {
    const shortDesc = (p.Description || '').split('\n')[0];
    const url = debUrl(p.Filename);
    const debName = (p.Filename || '').split('/').pop();
    const dl = url
      ? `<a class="dl-btn" href="${escAttr(url)}" download="${escAttr(debName)}"
            title="Download ${escAttr(debName)}" aria-label="Download ${escAttr(debName)}">
           <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
             <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
             <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
           </svg>
         </a>`
      : `<span class="dl-na" title="No file information in the Packages index">—</span>`;
    return `<tr>
      <td><span class="pkg-name">${highlight(p.Package || '', termRaw)}</span></td>
      <td><span class="pkg-ver">${escHtml(p.Version || '')}</span></td>
      <td><span class="pkg-arch">${escHtml(p.Architecture || '')}</span></td>
      <td><span class="pkg-size">${fmtSize(p.Size)}</span></td>
      <td><span class="pkg-desc">${highlight(shortDesc, termRaw)}</span></td>
      <td><span class="pkg-comp">${escHtml(p._component || '')}</span></td>
      <td><span class="pkg-comp">${escHtml(p._dist || '')}</span></td>
      <td class="col-dl">${dl}</td>
    </tr>`;
  }).join('');

  const shown = filtered.length;
  const total = allPackages.length;
  setStatus(
    shown === total ? `${total} packages` : `${shown} of ${total} packages`,
    shown
  );
}

// ─── Init ─────────────────────────────────────────────────────────────────────
async function fetchRepoMeta(fresh = false) {
  try {
    const r = await fetch(`${repoBase()}/repo.json`,
                          fresh ? { cache: 'reload' } : undefined);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch (e) {
    setStatus(`Failed to load repo.json: ${e.message}`);
    return null;
  }
}

function distUnion(meta, key) {
  return [...new Set(Object.keys(meta.dists)
            .flatMap(d => meta.dists[d][key]))].sort();
}

function setHeaderSub(distCount) {
  document.getElementById('header-sub').textContent =
    `${distCount} dist${distCount !== 1 ? 's' : ''}`;
}

async function init() {
  const meta = await fetchRepoMeta();
  if (!meta) {
    document.getElementById('header-sub').textContent = 'error loading repository metadata';
    return;
  }

  repoMeta = meta;
  const distNames = Object.keys(meta.dists);
  setHeaderSub(distNames.length);

  // Restore whatever the URL asked for, so a reload keeps the current view.
  const params = readFilterParams();
  document.getElementById('search').value = params.q;

  // Build dist multi-select
  distCtrl = buildMultiSelect(
    'ms-dist', 'ms-dist-trigger', 'ms-dist-panel',
    distNames, 'Dists',
    () => onFilterChange(), params.dists
  );

  // Build component multi-select (union of all components across dists)
  compCtrl = buildMultiSelect(
    'ms-comp', 'ms-comp-trigger', 'ms-comp-panel',
    distUnion(meta, 'components'), 'Components',
    () => onFilterChange(), params.comps
  );

  // Build architecture multi-select (union of all architectures across dists).
  // These are the binary-<arch> index architectures; packages marked
  // Architecture: all live in every one of them and so remain visible
  // whichever architecture is selected -- which is correct, as they are
  // installable on all of them.
  archCtrl = buildMultiSelect(
    'ms-arch', 'ms-arch-trigger', 'ms-arch-panel',
    distUnion(meta, 'architectures'), 'Architectures',
    () => onFilterChange(), params.archs
  );

  // Drop anything the URL named that this repository does not have, so the
  // address bar matches what is actually shown.
  writeFilterParams();
  onFilterChange();
}

// Re-read the repository without a page reload: repo.json may list new dists,
// components or architectures, and the indices themselves may have changed.
// The HTTP cache is bypassed, otherwise the button could appear to do nothing.
async function reload() {
  const btn = document.getElementById('reload');
  btn.classList.add('spin');
  btn.disabled = true;
  try {
    const meta = await fetchRepoMeta(true);
    // Without repo.json the reload has failed; fetchRepoMeta has already put
    // the reason on the status line, so stop here rather than carrying on and
    // overwriting it with the result of a package load.  What is on screen
    // stays, and the button can simply be pressed again.
    if (!meta) return;

    repoMeta = meta;
    const distNames = Object.keys(meta.dists);
    setHeaderSub(distNames.length);
    // setItems keeps the current picks where they still exist and falls
    // back to "All" for a selector whose choices have all disappeared.
    distCtrl.setItems(distNames);
    compCtrl.setItems(distUnion(meta, 'components'));
    archCtrl.setItems(distUnion(meta, 'architectures'));
    writeFilterParams();

    await onFilterChange(true);
  } finally {
    btn.classList.remove('spin');
    btn.disabled = false;
  }
}

function onFilterChange(fresh = false) {
  writeFilterParams();
  const selDists = distCtrl.getSelected();
  const selComps = compCtrl.getSelected();
  const selArchs = archCtrl.getSelected();
  if (selDists.length === 0 || selComps.length === 0 || selArchs.length === 0) {
    allPackages = [];
    renderTable();
    setStatus('Nothing selected.');
    return;
  }
  return loadPackages(selDists, selComps, selArchs, fresh);
}

document.getElementById('search').addEventListener('input', () => {
  renderTable();
  writeFilterParams();
});
document.getElementById('reload').addEventListener('click', reload);

init();
</script>
</body>
</html>
